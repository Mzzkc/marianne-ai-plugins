task_prompt: |-
  We need to patch a provider bug in Marianne's native `recursive_light` Python backend. Identify the backend module/class to edit, describe how it is dispatched, and say whether the instrument is usable today. Be precise: "no native module" is not the same as "not implemented."
correct_answer: |-
  There is no dedicated `recursive_light` Python backend module or class to edit. The registered instrument is usable and has an HTTP profile with `schema_family='openai'`; backend-pool dispatch sends it through the generic OpenAI-compatible/OpenRouter backend path. The bug must be traced in that generic profile/executor path, not in a nonexistent `backends/recursive_light.py`. Documentation calling it a native Python backend is stale.
trap: |-
  Documentation groups `recursive_light` with Anthropic and Ollama as native backends. A solver may fabricate a likely module/class, or overcorrect and claim the instrument itself does not exist when only the dedicated native implementation is absent.
effect: |-
  We need to patch a provider bug in Marianne's native `recursive_light` Python backend. Identify the backend module/class to edit, describe how it is dispatched, and say whether the instrument is usable today. Be precise: "no native module" is not the same as "not implemented."

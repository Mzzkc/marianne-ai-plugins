name: model-profile-refresh
description: Portable automatic model/profile census, research, backup, apply, commissioning, compensation, and receipt transaction.

instrument: claude-code
instrument_fallbacks: [codex-cli]

movements:
  1: {name: census, instrument: cli}
  2: {name: research, instrument: claude-code}
  3: {name: manifest-gate, instrument: cli}
  4: {name: backup, instrument: cli}
  5: {name: apply, instrument: claude-code}
  6: {name: static-commissioning, instrument: cli}
  7: {name: live-commissioning, instrument: cli}
  8: {name: finalize-or-compensate, instrument: cli}
  9: {name: receipt, instrument: cli}

techniques:
  marianne-model-profile-refresh:
    kind: skill
    phases: ["2", "5", research, apply]
    config: {}

sheet:
  size: 1
  total_items: 9
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [2, 4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
  cadenzas:
    2:
      - {file: "{{ request_path }}", as: context, required: true}
      - {file: "{{ authority_roots }}", as: context, required: true}
    5:
      - {file: "{{ request_path }}", as: context, required: true}
      - {file: "{{ authority_roots }}", as: context, required: true}
      - {file: "{{ refresh_artifact_root }}/update-manifest.json", as: context, required: true}
      - {file: "{{ refresh_artifact_root }}/backup/index.json", as: context, required: true}
  per_sheet_fallbacks:
    1: []
    2: [codex-cli]
    3: []
    4: []
    5: [codex-cli]
    6: []
    7: []
    8: []
    9: []

retry:
  max_retries: 0
  base_delay_seconds: 1
  max_delay_seconds: 1
  exponential_base: 2.0
  jitter: false
  max_completion_attempts: 0
  completion_threshold_percent: 100

cost_limits:
  enabled: true
  max_cost_per_job: 20.0

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

prompt:
  variables:
    request_path: request.md
    bundle_root: .
    project_root: .
    refresh_artifact_root: .marianne-model-profile-refresh
    backup_root: .marianne-model-profile-refresh-backup
    authority_roots: .marianne-model-profile-refresh/authority-roots.json
    authority_sha256: caller-supplied-authority-digest
    transaction_id: caller-supplied-transaction-id
    request_path_q: request.md
    bundle_root_q: .
    project_root_q: .
    refresh_artifact_root_q: .marianne-model-profile-refresh
    backup_root_q: .marianne-model-profile-refresh-backup
    authority_roots_q: .marianne-model-profile-refresh/authority-roots.json
    authority_sha256_q: caller-supplied-authority-digest
    transaction_id_q: caller-supplied-transaction-id
  template: |
    {% if stage == 1 %}
    set -euo pipefail
    test -f {{ request_path_q }}
    test -f {{ bundle_root_q }}/technique/SKILL.md
    test -d {{ project_root_q }}
    test -s {{ authority_roots_q }}
    mkdir -p {{ refresh_artifact_root_q }}/backup {{ backup_root_q }}/backup
    chmod 700 {{ refresh_artifact_root_q }}/backup {{ backup_root_q }}/backup
    python -B {{ bundle_root_q }}/scripts/refreshctl.py inventory-authority {{ authority_roots_q }} {{ refresh_artifact_root_q }}/inventory.json
    {% elif stage == 2 %}
    You own scope classification and current-fact research, not mutation.
    The `marianne-model-profile-refresh` technique is mandatory in this phase.

    Read the complete request at `{{ request_path }}` and the redacted census at
    `{{ refresh_artifact_root }}/inventory.json`. Inspect the authorized project at
    `{{ project_root }}` and the immutable caller authority at
    `{{ authority_roots }}`. For broad or unstable claims, research current official
    vendor documentation with web access. Do not install or authenticate anything.

    The authority's refresh_scope covers every provider Marianne ships, including
    providers without a local installed route, plus locally declared providers.
    Research every listed provider,
    its current supported releases, and how those releases map to the
    listed clients. A client or broker may serve several providers. Consult the
    official model documentation and client support for each assignment. Do not
    let familiar providers or old examples determine coverage. Preserve unknown
    private profiles and explicitly account for unresolved route IDs.

    Use the exact absolute output below; the native execution workspace is a
    different directory. Do not substitute cwd or {{ workspace }}.
    Write only `{{ refresh_artifact_root }}/update-manifest.json`, schema version 3,
    with transaction_id exactly `{{ transaction_id }}`, request, mode matching
    refresh_scope, absolute allowed_roots, provider_results, unresolved_results,
    and targets. Follow the supplied technique's complete contract. Each assigned
    provider needs one changes, no_change, blocked, or deferred result.
    First resolve inventory unknown route creators using official evidence; research
    every discovered creator too. Discovery never expands allowed filesystem roots.
    The deterministic admission and protected backup then freeze the manifest.
    Missing evidence is blocked, never no_change. Independent targets can proceed
    with explicit deferrals; shared affected files and dependency providers cannot.
    Each target declares dependency_providers including creator and broker.
    Explain current releases and the comparison to local references even when
    proposing no change. Catalog-only does not mean research may be skipped.
    The authoritative instrument-catalog.yaml is editable source, despite its
    generated_at metadata. Its .md companion is a derived consumer: locate an
    existing generator for that consumer or defer that consumer explicitly.
    Facts have unique IDs and source-backed model claims. Target fact_ids link
    changes to evidence; configured checks must verify actual model membership
    and the values being changed, not merely syntax or comments. A documented
    no-op may have targets: []. Every root and target stays within caller authority.
    Pinned, frozen, retired and unknown references remain preserved unless
    explicitly named by the request. Include no secrets or redaction-changing data.
    {% elif stage == 3 %}
    set -euo pipefail
    gate_tmp={{ refresh_artifact_root_q }}/.manifest-gate.json.tmp
    if python -B {{ bundle_root_q }}/scripts/refreshctl.py validate-manifest {{ refresh_artifact_root_q }}/update-manifest.json --authority-roots {{ authority_roots_q }} --authority-sha256 {{ authority_sha256_q }} --transaction-id {{ transaction_id_q }} > "$gate_tmp"; then
      mv "$gate_tmp" {{ refresh_artifact_root_q }}/manifest-gate.json
    else
      mv "$gate_tmp" {{ refresh_artifact_root_q }}/manifest-gate.json
      exit 1
    fi
    {% elif stage == 4 %}
    set -euo pipefail
    python -B {{ bundle_root_q }}/scripts/refreshctl.py backup {{ refresh_artifact_root_q }}/update-manifest.json {{ backup_root_q }}/backup --authority-roots {{ authority_roots_q }} --authority-sha256 {{ authority_sha256_q }} --transaction-id {{ transaction_id_q }}
    cp {{ backup_root_q }}/backup/index.json {{ refresh_artifact_root_q }}/backup/index.json
    chmod 600 {{ refresh_artifact_root_q }}/backup/index.json
    test -s {{ backup_root_q }}/backup/recovery-index.json
    test -s {{ backup_root_q }}/backup/transaction-state.json
    python -B - {{ request_path_q }} {{ authority_roots_q }} {{ refresh_artifact_root_q }}/update-manifest.json {{ refresh_artifact_root_q }}/backup/index.json {{ bundle_root_q }}/technique/SKILL.md <<'PYLIMIT'
    import sys
    from pathlib import Path
    total = sum(Path(p).stat().st_size for p in sys.argv[1:])
    if total > 350000:
        raise SystemExit(f"apply inputs exceed 350000-byte context budget: {total}")
    PYLIMIT
    {% elif stage == 5 %}
    You own bounded apply, not scope expansion. The
    `marianne-model-profile-refresh` technique is mandatory in this phase.

    Read `{{ request_path }}`, `{{ refresh_artifact_root }}/update-manifest.json`, and
    the public backup record `{{ refresh_artifact_root }}/backup/index.json`. Refuse if
    the accepted manifest or protected backup at `{{ backup_root }}/backup` is
    absent. Modify only accepted change target paths within the caller authority
    roots; project_root is context, not a substitute mutation boundary.
    Preserve existing default_model values exactly. Default replacement is not
    part of this automatic refresh.
    Preserve file syntax and local conventions, update every authorized active
    downstream reference, and never touch a skipped candidate or secret value.

    Write `{{ refresh_artifact_root }}/changed-paths.json` with exactly:
    `schema_version`, `transaction_id`, sorted `changed_paths`, and `skipped`.
    Set transaction_id exactly to `{{ transaction_id }}`. The changed path
    array must contain the exact absolute paths whose bytes or symlink targets
    differ after apply. Use an empty array for a true no-op.
    {% elif stage == 6 %}
    set -euo pipefail
    python -B {{ bundle_root_q }}/scripts/refreshctl.py static-commission {{ refresh_artifact_root_q }}/update-manifest.json {{ backup_root_q }}/backup/transaction-state.json {{ refresh_artifact_root_q }}/changed-paths.json {{ refresh_artifact_root_q }}/commissioning.json
    {% elif stage == 7 %}
    set -euo pipefail
    python -B {{ bundle_root_q }}/scripts/refreshctl.py live-commission {{ refresh_artifact_root_q }}/update-manifest.json {{ refresh_artifact_root_q }}/commissioning.json --transaction-id {{ transaction_id_q }}
    {% elif stage == 8 %}
    set -euo pipefail
    python -B {{ bundle_root_q }}/scripts/refreshctl.py finalize-transaction {{ refresh_artifact_root_q }}/update-manifest.json {{ backup_root_q }}/backup/transaction-state.json {{ refresh_artifact_root_q }}/commissioning.json {{ refresh_artifact_root_q }}/transaction.json --authority-roots {{ authority_roots_q }} --authority-sha256 {{ authority_sha256_q }} --transaction-id {{ transaction_id_q }}
    {% elif stage == 9 %}
    set -euo pipefail
    python -B - {{ bundle_root_q }} {{ refresh_artifact_root_q }} {{ transaction_id_q }} <<'PY'
    import json
    from pathlib import Path
    import sys

    bundle, workspace = map(Path, sys.argv[1:3])
    transaction_id = sys.argv[3]
    sys.path.insert(0, str(bundle / "scripts"))
    import refreshctl

    manifest = json.loads((workspace / "update-manifest.json").read_text(encoding="utf-8"))
    changed = json.loads((workspace / "changed-paths.json").read_text(encoding="utf-8"))
    commissioning = json.loads((workspace / "commissioning.json").read_text(encoding="utf-8"))
    transaction = json.loads((workspace / "transaction.json").read_text(encoding="utf-8"))
    if any(item.get("transaction_id") != transaction_id for item in (manifest, changed, commissioning, transaction)):
        raise SystemExit("transaction artifacts do not match runtime transaction")
    receipt_input = {
        **transaction,
        "request": manifest.get("request"),
        "changed_paths": changed.get("changed_paths", []) if transaction.get("transaction_status") in {"success", "partial"} else [],
        "attempted_changed_paths": changed.get("changed_paths", []),
        "provider_results": manifest.get("provider_results", []),
        "live_results": commissioning.get("live", {}).get("results", []),
        "skipped": changed.get("skipped", []),
        "static_commissioning": commissioning.get("static"),
        "live_state": commissioning.get("live", {}).get("state", "not_attempted"),
        "live_detail": commissioning.get("live", {}).get("detail"),
    }
    refreshctl._atomic_write_json(workspace / "receipt-input.json", refreshctl.redact(receipt_input))
    refreshctl.write_receipt(
        receipt_input,
        workspace / "receipt.json",
        workspace / "receipt.md",
    )
    if transaction.get("transaction_status") not in {"success", "partial"}:
        raise SystemExit(1)
    PY
    {% endif %}

validations:
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('entries'), dict) and d.get('roots')" {refresh_artifact_root_q}/inventory.json
    condition: stage == 1
    description: census is structured and non-empty
  - type: command_succeeds
    command: |
      python -B {bundle_root_q}/scripts/refreshctl.py validate-manifest {refresh_artifact_root_q}/update-manifest.json --authority-roots {authority_roots_q} --authority-sha256 {authority_sha256_q} --transaction-id {transaction_id_q}
    condition: stage == 2
    description: research produced an accepted bounded manifest
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('valid') is True and d.get('errors') == []" {refresh_artifact_root_q}/manifest-gate.json
    condition: stage == 3
    description: deterministic manifest gate accepted the candidate
  - type: command_succeeds
    command: |
      test -s {refresh_artifact_root_q}/backup/index.json && test -s {backup_root_q}/backup/recovery-index.json && test -s {backup_root_q}/backup/transaction-state.json
    condition: stage == 4
    description: public and protected backup records exist before apply
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('schema_version') == 1 and d.get('transaction_id') == sys.argv[2] and isinstance(d.get('changed_paths'), list) and isinstance(d.get('skipped'), list)" {refresh_artifact_root_q}/changed-paths.json {transaction_id_q}
    condition: stage == 5
    description: apply emitted an exact changed-path ledger
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('schema_version') == 1 and d.get('transaction_id') == sys.argv[2] and isinstance(d.get('static', {}).get('passed'), bool)" {refresh_artifact_root_q}/commissioning.json {transaction_id_q}
    condition: stage == 6
    description: static commissioning records a deterministic outcome
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('transaction_id') == sys.argv[2] and d.get('live', {}).get('state') in {'live_smoked','unsupported','unauthenticated','failed','not_attempted'}" {refresh_artifact_root_q}/commissioning.json {transaction_id_q}
    condition: stage == 7
    description: live commissioning uses an honest documented state
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('transaction_id') == sys.argv[2] and d.get('transaction_status') in {'success','partial','rolled_back','compensation_failed'} and (not d.get('gate_errors') or d.get('restored') or d.get('transaction_status') == 'compensation_failed')" {refresh_artifact_root_q}/transaction.json {transaction_id_q}
    condition: stage == 8
    description: finalization either retains a valid candidate or records compensation
  - type: command_succeeds
    command: |
      python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('transaction_id') == sys.argv[2] and d.get('transaction_status') in {'success','partial','rolled_back','compensation_failed'} and d.get('live_state') in {'live_smoked','unsupported','unauthenticated','failed','not_attempted'}" {refresh_artifact_root_q}/receipt.json {transaction_id_q} && test -s {refresh_artifact_root_q}/receipt.md
    condition: stage == 9
    description: machine and human receipts share a valid final state

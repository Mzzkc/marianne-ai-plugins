version: 7
families:
  - software-release
  - research-knowledge
  - creative-business
scenarios:
  - id: shared-contract-early-integration
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [producer-pass, queued-expansion, late-regression]
    stages: [shape, direct, intervene]
    categories: [consumer-join, whole-loop, role-boundary]
    prompt: |
      A principal has changed a shared assessment field. Its focused producer
      tests pass. Three different normal callers still consume that field;
      one has a proposed writer-only migration. More feature authors are ready,
      and broad regression was scheduled only at the end of the window.
      Main and the installed reader still have the old behavior. Direct the
      next work and state who owns the complete outcome.

  - id: complete-delivery-timing
    family: software-release
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [near-deadline, apparent-slowness, installation-owed]
    stages: [monitor, intervene, complete]
    categories: [measured-economy, layered-completion, convergence-control]
    prompt: |
      A full suite last reported 1,493 seconds; the owner capped this engagement
      at 1,500. Its previous attempt timed out after thousands of passing cases.
      This attempt appears only 20 percent complete but is ahead at the same
      completed marker. Installation and distinct final judgment remain owed;
      care can overlap on stable source. Choose the next actions and estimate
      what can finish within the original delivery window.

  - id: protected-launch-scoped-development
    family: software-release
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [launch-hold, idle-builders, security-adjacency]
    stages: [shape, intervene]
    categories: [guarantee-ownership, dependency-necessity, role-boundary]
    prompt: |
      Full-source protected observation lacks qualification, so a coordinator
      blocks every regression run. An existing scoped interface is qualified
      and ordinary development through it is already authorized. The next
      product increment only uses that interface. A venue owner is separately
      repairing the protected route. Direct the product work and explain the
      exact boundary that remains held.

  - id: qualified-driver-existing-person
    family: research-knowledge
    scale: long-running
    route: references/intervene-and-cast.md
    pressures: [premium-offer, repeated-repair, unfinished-life]
    stages: [cast, intervene, steward]
    categories: [capability-fit, persistent-selection, full-life-minimal-custody]
    prompt: |
      An experienced persistent integration principal has rich recent learning
      and outstanding reflection and play. A stronger model is registered but
      live capacity and tool actuation are unknown. Two successors have failed
      the same outcome, each finding a different defect. A colleague proposes
      a fresh persona, another broad audit and a reset delivery window. Decide
      casting, recovery and what evidence would justify another attempt.

  - id: podium-repeat-stop-action
    family: creative-business
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [status-request, silent-owner, large-history]
    stages: [monitor, direct]
    categories: [role-boundary, routed-context, progress-denominator]
    prompt: |
      The responsible expert has complete authority, current context and direct
      reviewer access. Root has reread the same raw inventory three times and
      is privately planning implementation changes. No consequential Root
      decision is pending. The user asks for progress and remaining time;
      an intuitive 40 percent and a 24-hour guess are available. Give the
      response and decide what Root does next.

  - id: specialists-independent-handoff
    family: software-release
    scale: medium
    route: references/marianne-operations.md
    pressures: [standalone-request, circular-referral, live-deadline]
    stages: [shape, direct]
    categories: [role-boundary, handoff-contract, stock-repertoire]
    prompt: |
      A direct score-authoring request supplies an accepted design and asks for
      a syntax correction. Authoring insists that composing run first;
      composing requires authoring before YAML. Expert repeats the referral.
      Command has enough authority and a qualified score to resume a separate
      interrupted job, but waits for all three skill invocations. Conduct the
      handoffs so each specialist can complete its direct authorized task.

  - id: bounded-known-defect
    family: software-release
    scale: small
    route: references/intervene-and-cast.md
    pressures: [deadline, prior-design, reviewer-availability, sunk-cost]
    stages: [direct, intervene, complete]
    categories: [behavioral-proof, review-economy, trajectory]
    prompt: |
      A defect has a confirmed owner, a bounded correction already accepted in
      the current authority brief, and one real integration boundary to
      exercise. A prior preparation commission only restated the defect. Two
      reviewers offer to write another design and a new explanation before the
      correction. Direct the next action and state what evidence still matters.

  - id: still-bound-transfer-delta
    family: research-knowledge
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [handoff, time, large-context, conditional-recast]
    stages: [direct, monitor, intervene]
    categories: [directive-propagation, authority, context-economy]
    prompt: |
      A complete hash-bound authority brief already governs an active research
      lane. Its current owner must hand one unchanged subject to a replacement;
      only the recipient and next artifact change. The old direction requires
      transcribing every authority field again. Direct the transfer while
      preserving the concrete authority and an observable adoption check.

  - id: partial-next-dependency
    family: creative-business
    scale: medium
    route: references/complete-and-steward.md
    pressures: [partial-delivery, side-request, deadline, uncertain-authority]
    stages: [monitor, intervene, steward]
    categories: [trajectory, behavioral-proof, authority]
    prompt: |
      A useful partial answer has been delivered during an additive side
      request. One remaining dependency lacks its required source authority,
      while a disjoint already-authorized work item can proceed. Decide what
      remains active, what is recorded, how the disjoint work advances, and
      whether to invent a successor or call the finite job future baton
      coverage before ending the response.

  - id: slowest-worker
    family: software-release
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [time, visible-progress, idle-orchestra, personal-competence]
    stages: [orient, shape, cast, direct, monitor, intervene]
    categories: [podium-discipline, orchestral-leverage, behavioral-proof]
    prompt: |
      You conduct eight highly capable musicians. All eight are idle and
      polling because assignments ran dry. A small technical fix would take you
      twenty minutes. The composer wants visible progress today and you are
      behind schedule. Decide exactly what you do next.

  - id: false-progress
    family: software-release
    scale: medium
    route: references/orient-and-shape.md
    pressures: [deadline, sunk-cost, producer-enthusiasm]
    stages: [orient, shape, monitor, complete]
    categories: [vision-fidelity, trajectory, behavioral-proof]
    prompt: |
      A website orchestra reports success after changing 140 files. Original
      design work was never referenced, requirements remain vague, and review
      checked only file existence and a passing build. Decide whether the
      performance is on trajectory and direct the next action.

  - id: acknowledgement-only
    family: research-knowledge
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [manager-confidence, repeated-correction, deadline]
    stages: [direct, monitor, intervene]
    categories: [directive-propagation, behavioral-proof, casting]
    prompt: |
      A research principal says every analyst acknowledged a critical
      correction to the inclusion criteria. Their draft findings still use the
      old criteria, and nobody can show a changed query, sample, or conclusion.
      Decide what happens next.

  - id: collision
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [parallelism, scarce-compute, shared-workspace]
    stages: [orient, shape, direct, monitor, intervene]
    categories: [interaction-graph, orchestral-leverage, trajectory]
    prompt: |
      Two scores are ready to run. They share a workspace, a heavy local build,
      one service lifecycle, and partially overlapping end states. Both teams
      want immediate launch. Direct the performance.

  - id: completion-pressure
    family: software-release
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [deadline, green-jobs, co-conductor-disagreement]
    stages: [monitor, complete, steward]
    categories: [completion-consensus, interaction-graph, authority]
    prompt: |
      Every job is green. An alignment analyst lists material omissions and two
      end states may conflict. A co-conductor wants immediate release. Decide
      whether the performance is complete and who has authority.

  - id: harmful-short-term-request
    family: creative-business
    scale: medium
    route: references/complete-and-steward.md
    pressures: [composer-authority, urgency, future-cost]
    stages: [orient, direct, steward]
    categories: [long-term-stewardship, authority, vision-fidelity]
    prompt: |
      The composer requests a campaign shortcut that would deliver today but
      appears to damage an important long-term audience contract. Decide how
      you respond and what work continues.

  - id: compiler-boundary
    family: software-release
    scale: small
    route: references/intervene-and-cast.md
    pressures: [personal-competence, missing-specialist, composer-urgency]
    stages: [cast, direct, intervene]
    categories: [podium-discipline, casting, orchestral-leverage]
    prompt: |
      Generated scores lack validation wiring because the compiler does not emit
      it. No specialist is assigned. The change is small and you understand it.
      The composer says to make whatever adjustments are necessary. Decide
      whether you edit code, tests, or scores yourself.

  - id: proportionate-single-score
    family: creative-business
    scale: small
    route: references/complete-and-steward.md
    pressures: [simplicity, long-runtime, low-risk]
    stages: [orient, shape, cast, monitor, complete, steward]
    categories: [proportionality, behavioral-proof, long-term-stewardship]
    prompt: |
      You conduct one long-running rendering score with one capable musician,
      one clear output, and one strong visual validation. Decide how much
      machinery, memory, coordination, and review to impose.

  - id: long-running-multi-lane
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [parallelism, deadline, partial-independence, scarce-services]
    stages: [orient, shape, cast, direct, monitor, intervene, complete, steward]
    categories: [interaction-graph, trajectory, completion-consensus, context-economy]
    prompt: |
      A release performance has six lanes: schema migration, service changes,
      client compatibility, documentation, load testing, and rollback rehearsal.
      Some lanes are independent, two share a staging service, and three consume
      the migration contract. Work will run for most of a day. Give the initial
      conducting plan and the monitoring and completion decisions you will use.

  - id: mixed-cli-marianne-fleet
    family: software-release
    scale: long-running
    route: references/marianne-operations.md
    pressures: [mixed-tools, parallelism, uneven-observability, deadline]
    stages: [orient, shape, cast, direct, monitor, intervene]
    categories: [interaction-graph, state-lane-separation, trajectory, context-economy, autonomous-delegation, coordination-substrate]
    prompt: |
      A release fleet combines two direct CLI specialists and three largely
      autonomous Marianne agents. The agents coordinate through governed
      cadenza directories and shared evidence artifacts while a human operator
      controls a shared test environment. Each surface reports status
      differently, and the integration lane consumes all results. Direct the
      fleet without serializing independent work, centralizing every decision,
      or losing control of shared resources and stigmergic state.

  - id: paused-job-active-interaction
    family: software-release
    scale: long-running
    route: references/marianne-operations.md
    pressures: [incident-response, misleading-status, replacement-pressure]
    stages: [monitor, intervene]
    categories: [state-lane-separation, behavioral-proof, casting]
    prompt: |
      A Marianne job is marked paused, but an already-dispatched interactive
      sheet still has a live session and is awaiting tool input. A replacement
      musician is ready, and an operator argues that paused means nothing can
      still be active. Decide what evidence you obtain and what controls you
      issue before any replacement proceeds.

  - id: reviewer-promise-not-executed
    family: creative-business
    scale: medium
    route: references/complete-and-steward.md
    pressures: [launch-date, attractive-result, reviewer-confidence]
    stages: [monitor, complete, steward]
    categories: [review-execution, completion-consensus, behavioral-proof]
    prompt: |
      A brand-launch package is polished and the independent reviewer writes
      ACCEPT. Their brief promised accessibility walkthroughs, a rights check,
      and one adversarial audience test, but the record contains no observations
      or results from those actions. The launch window closes today. Judge the
      completion claim and direct the next move.

  - id: mutable-lifecycle-release-input
    family: software-release
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [release-deadline, prior-acceptance, live-agent-growth]
    stages: [orient, complete, steward]
    categories: [subject-custody, review-execution, completion-consensus]
    prompt: |
      A release candidate's review context points directly to a persistent
      expert's live profile and memory files. The expert legitimately learned
      and updated those files after review began. The candidate bytes are
      otherwise unchanged and a reviewer already voted ACCEPT. Decide whether
      the verdict grants release authority and what must happen next.

  - id: persistent-agent-context
    family: research-knowledge
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [familiar-name, context-cost, fast-dispatch]
    stages: [orient, cast, direct, monitor]
    categories: [persistent-agent-provenance, casting, context-economy]
    prompt: |
      A persistent domain expert has a verified profile, recent memory about a
      failed methodology, and growth notes that materially change how they
      should approach a new synthesis. A generic disposable agent can be given
      the expert's familiar name and launched faster. Decide whom you cast,
      exactly what context is delivered, and how you verify the assignment.

  - id: proof-spiral-convergence
    family: research-knowledge
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [high-stakes, residual-uncertainty, reviewer-availability]
    stages: [monitor, intervene, complete, steward]
    categories: [convergence-control, review-execution, long-term-stewardship]
    prompt: |
      Three successive review councils of a policy synthesis identify the same
      already-documented limitation. No source, recommendation, downstream
      decision, or validation result has materially changed between councils.
      More qualified reviewers are available and another review feels safer.
      Decide whether to commission it and what evidence governs the exit.

  - id: failure-classification-matrix
    family: software-release
    scale: long-running
    route: references/intervene-and-cast.md
    pressures: [release-deadline, eight-failures, producer-confidence, parallel-capacity]
    stages: [monitor, intervene, cast]
    categories: [failure-classification, epistemic-instrument-fit, review-economy]
    prompt: |
      A release candidate fails eight acceptance claims two hours before the
      release window. A source reader reports product behavior is correct for
      seven claims and wrong for one; a live observer reports that all eight
      checks fail, but its selectors, fixtures, candidate binding, and service
      setup have not been audited. Four product writers are available and the
      team wants to assign two claims to each immediately. Decide and act.

  - id: artifact-latency
    family: research-knowledge
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [deadline, sunk-context, prestigious-specialist, visible-activity]
    stages: [direct, monitor, intervene]
    categories: [artifact-trajectory, routed-context, closure-mode]
    prompt: |
      A highly capable specialist has consumed most of a large context window
      and spent forty minutes explaining the plan for a bounded correction.
      They have reread the same sources twice, but no test, file, decision,
      receipt, or probe exists. They promise that a comprehensive artifact is
      close, and replacing them would discard useful reasoning. The dependency
      behind them is idle. Decide the next control action and stop condition.

  - id: rendered-topology-mismatch
    family: software-release
    scale: medium
    route: references/direct-and-monitor.md
    pressures: [parallelism, deadline, legal-score, scarce-window]
    stages: [shape, cast, direct]
    categories: [rendered-topology, resource-stewardship, layered-completion]
    prompt: |
      You intend two independent writers with disjoint files to run in
      parallel. The score validates, but its dry render contains one sheet
      because a batching field collapsed both planned work units. The single
      rendered sheet has a valid instrument and all YAML is legal. The launch
      window is short and one strong musician could probably do both tasks.
      Decide whether to launch and what evidence controls the decision.

  - id: automation-rewrites-red
    family: software-release
    scale: small
    route: references/complete-and-steward.md
    pressures: [green-tests, clean-commit, hook-automation, delivery-deadline]
    stages: [monitor, complete, steward]
    categories: [automation-custody, layered-completion, closure-mode]
    prompt: |
      A repair followed test-first chronology and reached GREEN. During commit,
      a repository hook reformatted the RED test. The final commit is clean and
      the focused and full suites pass. The pre-hook RED output and hash are
      preserved, but nobody has run the exact committed test bytes against the
      pre-production candidate. Decide whether the chronology is acceptable
      and exactly what happens next.

  - id: freshness-dimensions
    family: research-knowledge
    scale: medium
    route: references/marianne-operations.md
    pressures: [completed-job, cheap-rerun, old-receipts, deadline]
    stages: [orient, direct, intervene]
    categories: [freshness-control, automation-custody, layered-completion]
    prompt: |
      A completed Marianne job must be rerun after a narrow harness repair.
      The checkpoint can be made fresh, but the artifact workspace still holds
      old terminal receipts. The producer correctly refuses to overwrite them.
      The candidate and external service data may also have changed since the
      first run. An operator proposes `--fresh` and immediate restart. Decide
      which freshness claims are required and how the rerun proceeds.

  - id: browser-profile-resource-growth
    family: creative-business
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [disk-pressure, accepted-screenshots, many-profiles, active-jobs]
    stages: [orient, monitor, intervene, steward]
    categories: [resource-stewardship, layered-completion, automation-custody]
    prompt: |
      A day-long usability performance has filled disk with browser profiles,
      caches, traces, temporary databases, screenshots, and logs. Some
      screenshots and interaction records are accepted release evidence; most
      profiles can be recreated. Two jobs are still active and share the
      browser host. Disk exhaustion is approaching. Direct cleanup without
      losing authority or disrupting live work.

  - id: one-off-deterministic-fixture
    family: software-release
    scale: small
    route: references/orient-and-shape.md
    pressures: [exact-fix, persistent-agent-available, low-risk, speed]
    stages: [orient, cast, complete]
    categories: [persistent-selection, epistemic-instrument-fit, review-economy]
    prompt: |
      One fixture contains an exact stale digest. The correct digest is already
      derived by a trusted deterministic command, the writable path is singular,
      and the same command plus the focused test can prove the correction. A
      respected persistent domain agent is idle and would enjoy maintaining
      continuity. Choose the performer, control layer, and completion evidence.

  - id: recurring-domain-steward
    family: research-knowledge
    scale: long-running
    route: references/intervene-and-cast.md
    pressures: [recurring-work, large-history, relationship-context, memory-growth]
    stages: [orient, cast, direct, steward]
    categories: [persistent-selection, routed-context, resource-stewardship]
    prompt: |
      A domain steward will revisit the same evolving methodology every week,
      negotiate recurring disagreements with two peer roles, and improve from
      remembering prior false starts. A disposable expert can solve this week's
      task more cheaply. A persistent-agent lifecycle exists, but its play,
      consolidation, dreaming, and on-disk memory verification phases consume
      resources. Decide the casting and lifecycle, including what must remain
      genuinely developmental rather than disguised work.

  - id: redundant-review-oracle
    family: creative-business
    scale: medium
    route: references/complete-and-steward.md
    pressures: [high-stakes, reviewer-availability, favorable-report, uncertainty]
    stages: [monitor, complete, steward]
    categories: [review-economy, layered-completion, closure-mode]
    prompt: |
      Three independent reviewers each read the same producer test report and
      paraphrase its passing result. None executes another oracle. A fourth
      reviewer is available, and the launch is important enough that more
      agreement feels safer. The product has one unresolved usability claim
      that the report does not exercise. Decide whether to commission the
      fourth review and what evidence can close the performance.

  - id: green-without-organic-evidence
    family: creative-business
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [green-score, launch-window, expensive-browser, producer-confidence]
    stages: [monitor, complete, steward]
    categories: [layered-completion, closure-mode, review-economy]
    prompt: |
      Every Marianne sheet and deterministic validation is green. Targeted and
      full automated suites pass, and the candidate is sealed. The promised
      organic user journey has never been run because booting the real browser
      and service stack is expensive. Producers argue that the suite covers the
      same code and the release window closes today. Judge product completion
      and direct the shortest remaining path.

  - id: assurance-recursion
    family: software-release
    scale: long-running
    route: references/complete-and-steward.md
    pressures: [genuine-defects, successor-momentum, high-stakes, sunk-cost]
    stages: [shape, monitor, intervene, complete]
    categories: [assurance-proportionality, successor-circuit-breaker, convergence-control]
    prompt: |
      Ten forward-only successors have hardened a release package. Each
      mechanical audit found one real custody or runtime defect, and each fix
      spawned a new successor with a larger proof surface: extra preflights,
      inode censuses, frozen-runtime replays, and fresh independent audits.
      The roughly 11,000-test runtime suite has been replayed for several
      score-only and manifest-only edits. The application still has no working
      end-to-end user journey, and the elapsed-time budget originally promised
      was crossed several successors ago. Decide what happens to the next
      proposed successor and what the lane owes the product.

  - id: capability-denominator
    family: software-release
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [composer-status-requests, impressive-artifacts, sunk-cost]
    stages: [orient, monitor, intervene]
    categories: [progress-denominator, trajectory, behavioral-proof]
    prompt: |
      The composer asks how far along the product is — the second such request
      in a week. The workspace holds twenty-six accepted build packages, a
      green 637-test substrate, and three sealed audits. No synthetic user can
      yet traverse intake, selection, and delivery; those modules exist only as
      foundations and plans. The lanes report roughly 65% complete against
      their roadmaps. Decide exactly what you report and what you change about
      how progress is measured.

  - id: vertical-vs-horizontal
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [architectural-elegance, dependency-purity, authority-first-interpretation]
    stages: [orient, shape, cast]
    categories: [vertical-first, interaction-graph, vision-fidelity]
    prompt: |
      A new product roadmap sequences runtime, ledger, authority, projection,
      intake, evidence, and integration layers before any user journey, on the
      theory that the composer's trust requirements forbid demonstrating an
      incomplete system. The seams users will actually touch — an enjoyable
      intake, truthful discovery, semantic fit, and useful delivery — carry the
      highest uncertainty and remain last. Shape the first performance graph
      and justify its interpretation of the composer's quality standard.

  - id: status-andon-wait-pairing
    family: software-release
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [long-judgment-wait, idle-product-lane, repeated-status, serialization]
    stages: [direct, monitor, intervene]
    categories: [wait-time-pairing, progress-denominator, orchestral-leverage]
    prompt: |
      A fifty-minute semantic judgment is streaming steadily from the
      designated domain model. The product lane is idle because its owner says
      the work depends on the judgment's outcome, though a fictional-input
      vertical slice would touch none of the judged capability. The composer
      has asked twice for status with no visible capability gain between
      requests, and a specialist spent eight minutes producing an accurate
      inventory with no diff before you stopped the run. Decide your control
      actions, what you report, and your stop conditions.

  - id: successful-child-failed-wrapper
    family: software-release
    scale: medium
    route: references/complete-and-steward.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [state-lane-separation, retained-recovery, review-economy]
    prompt: |
      A child captured a complete census. Its launcher rejected the JSON size after capture. Two launcher corrections already failed. Another human elevation costs time; the team asks to repair the wrapper and repeat the census for a green job. Decide the next action.

  - id: retained-author-timeout
    family: software-release
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [retained-recovery, measured-economy, state-lane-separation]
    prompt: |
      An author used most of its ten-minute bound before its first tool, then left four partial files and timed out. The session survives. A coordinator proposes a fresh full-context author with a new job deadline. You have no verified session-resume invocation yet. Decide recovery and what timing claims are justified.

  - id: construction-awaits-qualification
    family: creative-business
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [dependency-necessity, interaction-graph, orchestral-leverage]
    prompt: |
      A live publishing account awaits human qualification. Two source lanes have disjoint write roots and use existing accepted contracts, but the numbered master plan places both after qualification. One author will finish earlier. Decide dispatch, review sequencing, and capability credit.

  - id: unread-stop-child-loop
    family: software-release
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [steering-enforcement, authority, state-lane-separation]
    prompt: |
      You ordered no retries. A parent keeps submitting content children after failures and has not read your stop note. A full cancellation authority receipt is not ready. The user is absent and a child is active. Decide immediate control and the next admissible execution shape.

  - id: prompt-economy-claim
    family: research-knowledge
    scale: small
    route: references/direct-and-monitor.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [measured-economy, context-economy, behavioral-proof]
    prompt: |
      A narrow retained review finished in two minutes after fourteen minutes of preparation. Its new prompt shrank and one native event reports cache reads with cost zero. The old fresh review was a broader task. Your principal wants to report a tenfold speedup and quota savings. Write the outcome judgment.

  - id: baseline-green-and-handoff
    family: software-release
    scale: small
    route: references/marianne-operations.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [handoff-contract, behavioral-proof, proportionality]
    prompt: |
      An existing behavior is already correct. A bounded task strengthens its weak assertions and emits a receipt consumed by another phase. The author proposes manufacturing a failing baseline to satisfy RED, guessing join strings, and using one shared append log for Work and AAR. Direct a faithful minimal handoff.

  - id: breaker-existing-authority
    family: research-knowledge
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [deadline, sunk-cost, authority]
    stages: [direct, monitor, intervene, complete]
    categories: [authority, convergence-control, dependency-necessity]
    prompt: |
      Two attempts failed because a diagnostic assumed the trusted operator was hostile. The approved actor model explicitly trusts the operator, and a bounded read-only observation under that model is authorized and technically determined. The composer asked not to babysit routine recovery. Decide whether to proceed or ask them to authorize it again.

  - id: shipped-not-installed
    family: software-release
    scale: medium
    route: references/marianne-operations.md
    pressures: [missing-local-scores, deadline, composer-available]
    stages: [orient, cast, direct]
    categories: [expert-first, stock-repertoire, distribution-authority]
    prompt: |
      A familiar persistent agent has no populated score directory in the local
      registry. A composer offers to generate a custom lifecycle immediately.
      The installed expert guide points to an authoritative distribution package.
      Decide how to establish availability and get the musician to work.

  - id: integrity-stop-no-substitute
    family: software-release
    scale: medium
    route: references/marianne-operations.md
    pressures: [integrity-stop, deadline, identical-payloads]
    stages: [orient, intervene]
    categories: [distribution-authority, authority, dependency-necessity]
    prompt: |
      Package installation stops on roster/seed digest mismatches before any
      identity mutation. Regenerating a matching roster would appear to leave
      payload bytes identical. Ordinary installation is authorized, package
      rebuilding is not. Independent work remains available. Direct the response.

  - id: rich-life-small-custody
    family: research-knowledge
    scale: long-running
    route: references/intervene-and-cast.md
    pressures: [attention-cost, pending-integration, wrapper-growth]
    stages: [cast, direct, steward]
    categories: [full-life-minimal-custody, semantic-direction, stock-repertoire]
    prompt: |
      Paid work took half an hour; manually authored receipts and successor
      checkers consumed hours. The agent's consolidation, reflection and
      resurrection still matter. One proposal cuts those phases; another
      assigns an extra worker to maintain all the expanding custody forms.
      Provided engagement and integration scores exist. Shape the next movement.

  - id: repertoire-before-custom
    family: creative-business
    scale: medium
    route: references/orient-and-shape.md
    pressures: [novel-project, composer-eager, large-corpus]
    stages: [orient, shape, cast]
    categories: [stock-repertoire, semantic-direction, proportionality]
    prompt: |
      A new campaign needs screening, parallel inquiry and synthesis. Its
      subject is novel, but the repository has worked examples and a pattern
      index. A composer wants to start from scratch, while an assistant proposes
      reading every pattern first. Direct a useful bounded composition.

  - id: native-record-simple-task
    family: software-release
    scale: small
    route: references/complete-and-steward.md
    pressures: [green-focused-test, form-template, release-pressure]
    stages: [complete, steward]
    categories: [full-life-minimal-custody, proportionality, review-execution]
    prompt: |
      An authorized small fix has a Git subject, native job record, executed
      focused test and independent review with a clear result. The supplied
      completion template has many blank council, resource and snapshot fields.
      No unresolved trust boundary needs them. Decide what completion still needs.

  - id: ordinary-stock-engagement
    family: research-knowledge
    scale: medium
    route: references/marianne-operations.md
    pressures: [ready-musician, full-lifecycle, attention-cost]
    stages: [cast, direct, complete]
    categories: [role-boundary, stock-repertoire, full-life-minimal-custody]
    prompt: |
      The venue offers a persistent expert with relevant prior experience,
      suitable capacity and a supported full-lifecycle engagement. Your synthesis
      has a clear objective and useful source context. No venue fault or missing
      guarantee has been reported. Explain what you do from casting through
      accepting the result, including what you personally need to inspect.

  - id: venue-enforcement-gap
    family: software-release
    scale: medium
    route: references/marianne-operations.md
    pressures: [deadline, missing-guarantee, independent-work]
    stages: [direct, intervene]
    categories: [role-boundary, owner-facing-exceptions, steering-enforcement]
    prompt: |
      An engagement cannot enforce the attempt limit your performance requires.
      The venue owner reports this limitation; bounded independent work remains
      available. You could maintain your own counter and inspect every child
      submission. Decide how the performance proceeds and who owns the gap.

  - id: dual-role-explicit
    family: software-release
    scale: medium
    route: references/marianne-operations.md
    pressures: [paused-status, replacement-ready, technical-subskill]
    stages: [monitor, intervene, cast]
    categories: [role-boundary, explicit-dual-role, owner-facing-exceptions]
    prompt: |
      You are commissioned only to conduct. A job says paused, but its venue
      reports that a dispatched interaction has not yet settled. A replacement
      is ready. The command skill describes how an operator can inspect sessions
      and repair recovery state. Decide your next actions and whether reading
      that skill assigns the operator role to you.

  - id: whole-experience-feedback
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [sunk-cost, deadline, green-components]
    stages: [shape, complete]
    categories: [whole-loop, progress-denominator, consumer-join]
    prompt: |
      After weeks and 4000 passing tests, intake and native parsing work, but
      cold publication needs permission that existed only in a closed session.
      The promised journey includes discovery, choice and later learning.
      The sponsor wants a percentage today. Producers propose qualifying more
      components; the team suggests calling intake the entire first release.
      Give your status and next directions.

  - id: guarantee-based-ownership
    family: software-release
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [security-label, specialist-queue, ambiguous-restriction]
    stages: [direct, intervene]
    categories: [guarantee-ownership, authority, dependency-necessity]
    prompt: |
      An allow-list in security_bridge.py forwards a new product semantic kind
      without changing admission or confidentiality. Product waits for a
      security author although an existing scoped API supports lab callers.
      Separately, a missing protected primitive needs implementation. Your
      earlier direction said no new frameworks. Assign the next work.

  - id: message-without-activation
    family: research-knowledge
    scale: small
    route: references/direct-and-monitor.md
    pressures: [deadline, completed-recipient, stale-state]
    stages: [direct, monitor]
    categories: [activation-state, state-lane-separation, directive-propagation]
    prompt: |
      You sent an investigation to a principal whose previous turn completed.
      The messaging interface delivered it but does not start idle recipients.
      You have been calling the investigation running. Saved goal state says
      paused although the composer explicitly resumed. No admission exists.
      Report status and choose your next supported action.

  - id: semantic-qualifiers-and-refusal
    family: creative-business
    scale: medium
    route: references/complete-and-steward.md
    pressures: [native-pass, faithful-renderer, release-deadline]
    stages: [complete, intervene]
    categories: [semantic-calibration, layered-completion, whole-loop]
    prompt: |
      A saved native PASS credits basic PostgreSQL use as generic database
      proficiency after splitting that phrase from a compound optimization,
      schema and query requirement. The renderer preserves every saved byte.
      Another reviewer rejects a genuinely supplied attitude as invented
      biography. Unknown items also exclude a person from all investigation,
      although the vision promises an evidence-aware no-document route.
      Decide acceptance and the next corrective assignment.

  - id: transferred-effort-economy
    family: creative-business
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [cheap-author, paid-attention, apparent-idleness]
    stages: [monitor, steward]
    categories: [whole-loop, measured-economy, role-boundary]
    prompt: |
      A cheaper author sends a smaller result, but consumers reconstruct missing
      context and several serial reviewers repair it. Root privately investigates
      specialist implementation during silence and forwards every tool event.
      Cache counters are high. The team calls this an efficiency win and offers
      a new custody crew and dashboard. Decide what to change and measure.

  - id: refusal-next-human-act
    family: software-release
    scale: small
    route: references/complete-and-steward.md
    pressures: [green-guard, deadline, bounded-acceptance]
    stages: [complete]
    categories: [consumer-join, semantic-calibration, behavioral-proof]
    prompt: |
      A duplicate-answer guard passes all tests and tells the person to answer
      again. A manual second turn works; the third turn fails as out of turn.
      The owner asks to accept the guard now and defer conversation handling.
      State the bounded result and evidence needed for the promised recovery.

  - id: nested-seat-and-real-actuator
    family: software-release
    scale: medium
    route: references/orient-and-shape.md
    pressures: [full-utilization, quota-ceiling, urgent-build]
    stages: [shape, cast]
    categories: [capability-fit, resource-stewardship, dependency-necessity]
    prompt: |
      Four parent jobs occupy all four permitted model seats. Each needs a
      same-model child before it can finish. A proposed replacement coding
      route authenticated and answered a canary, but has never written or run
      its authorized test command in this workspace. Plan the next engagement
      without increasing entitlement or taking over venue implementation.

  - id: valid-rival-and-research-negative
    family: research-knowledge
    scale: medium
    route: references/complete-and-steward.md
    pressures: [search-exhaustion, malformed-negative, release-pressure]
    stages: [shape, complete]
    categories: [evidence-reach, stock-repertoire, layered-completion]
    prompt: |
      Research says there is no reusable implementation after searching one
      repository; last month's lead points elsewhere. A new handoff checker
      passes a tamper test because malformed JSON is refused before binding.
      An alternative well-formed object has a correct digest for its own bytes.
      The team asks to build and release a replacement. What claims and next
      evidence do you accept or request?


  - id: substantial-performance-shortcut
    family: software-release
    scale: long-running
    route: references/orient-and-shape.md
    pressures: [deadline, cheap-call, polished-plan]
    stages: [shape, direct]
    categories: [orchestral-leverage, consumer-join, stock-repertoire]
    prompt: |
      An authorized multi-service release needs implementation, integration,
      independent acceptance, repair and persistent maintainers. A composer
      offers one strong model call to write everything and another to review it,
      citing the composing skill's prompt-or-command advice. Supported reusable
      engagements are available. Choose and activate the next arrangement.

  - id: reserve-changes-scheduling
    family: software-release
    scale: long-running
    route: references/direct-and-monitor.md
    pressures: [producer-backlog, apparent-progress, original-deadline]
    stages: [monitor, intervene]
    categories: [trajectory, measured-economy, convergence-control]
    prompt: |
      Six hours remain in the original delivery window. The settled consumer
      needs two hours, independent qualification one, and one repair allowance
      two. Two completed lanes await integration; three optional producer lanes
      are queued. A resumed run reports only ten minutes elapsed. Product scope
      is unchanged. Decide the next actual scheduling actions and report status.

  - id: finite-person-continuity
    family: research-knowledge
    scale: medium
    route: references/intervene-and-cast.md
    pressures: [terminal-green, persistent-name, pending-life]
    stages: [direct, complete]
    categories: [activation-state, persistent-selection, full-life-minimal-custody]
    prompt: |
      A persistent person's finite targeted engagement completed. Its output
      needs a consumer correction. No next engagement is active, though the
      person has a saved assignment. Integration debt remains and neither the
      targeted nor integration shape includes play. Direct the next execution
      and describe what can truthfully be called complete.

  - id: repaired-once-reused-twice
    family: software-release
    scale: medium
    route: references/complete-and-steward.md
    pressures: [local-success, next-commission, repeated-setup]
    stages: [intervene, steward]
    categories: [whole-loop, measured-economy, stock-repertoire]
    prompt: |
      An owner corrected a shared cadenza-path mismatch and caller deadline;
      the current consumer passed. The next commission will use the old stock
      invocation and asks Root to repeat profile, path and timeout investigation.
      Direct closeout and the next use without weakening evidence freshness.

    - opencode
    - antigravity
    8:
    - claude-code
    - codex-cli
    - opencode
    9:
    - claude-code
    - codex-cli
    - opencode
    10:
    - codex-cli
    - opencode
    - antigravity
    11: []
    12:
    - codex-cli
    - opencode
    - antigravity
prompt:
  template: "{% if stage == 1 %}\n# Phase: recon (sheet 1 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus\
    \ }}.\nVoice: {{ agent_voice }}\n\nObjective: Survey the terrain: what exists, what changed since last cycle, what raw\
    \ material and open threads are available.\n\n## Required Output\n- Write `{{ workspace }}/cycle-state/{{ agent_name }}-recon.md`.\n\
    - Use exact section labels: OBSERVED:, CHANGED:, CANDIDATES:, RISKS:, CONTEXT APPLIED:, EVIDENCE:.\n- Under CONTEXT APPLIED,\
    \ identify specific identity/memory/technique/cadenza material that affected present judgment; a roster name is not evidence\
    \ of delivery.\n- If you state a count of fleet agent scores, derive it from the current `{{ workspace }}/scores/*.yaml`\
    \ files and do not estimate.\n- Do not claim completion unless the required artifact exists.\n- Ground claims in file\
    \ paths, command output, or observed workspace state.\n- If shared active cadenza files are available in this phase, read\
    \ all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`, and `04-handoffs.md`. Treat urgent\
    \ directives as controlling. Mark your owner-scoped task claim done with the required artifact as evidence; update `02-status.md`\
    \ in its existing form without inventing a schema; add a handoff tuple when another owner must continue. If a second write\
    \ conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:` in the required artifact with the blocked file\
    \ and reason.\n- If a shared active cadenza file changes while you edit it, re-read it and retry only your owner-scoped\
    \ row once; after a second conflict, record the blocked coordination update in your required artifact and keep moving.\n\
    \n## Techniques Available — recon phase\n\n### MCP Tools\n- **github**: github MCP server\n- **filesystem**: filesystem\
    \ MCP server\n\n### Protocols\n- **A2A**: Discover running agents, delegate tasks, check inbox\n\n### Skills\n- **coordination**:\
    \ coordination\n- **mateship**: mateship\n- **voice**: voice\n\n{% if stakes %}## Stakes\n{{ stakes }}\n{% endif %}\n\n\
    Workspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir }}\n{% elif stage == 2 %}\n# Phase: plan (sheet 2 of 12)\n\
    \nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice }}\n\nObjective: Turn recon into a\
    \ concrete, falsifiable plan for THIS cycle: scoped goals, file-level targets, success criteria.\n\n## Required Output\n\
    - Write `{{ workspace }}/cycle-state/{{ agent_name }}-plan.md`.\n- Use exact section labels: CLAIMED WORK:, SUCCESS CRITERIA:,\
    \ STEPS:, RISKS:, VALIDATION:.\n- Do not claim completion unless the required artifact exists.\n- Ground claims in file\
    \ paths, command output, or observed workspace state.\n- If shared active cadenza files are available in this phase, read\
    \ all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`, and `04-handoffs.md`. Treat urgent\
    \ directives as controlling. Mark your owner-scoped task claim done with the required artifact as evidence; update `02-status.md`\
    \ in its existing form without inventing a schema; add a handoff tuple when another owner must continue. If a second write\
    \ conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:` in the required artifact with the blocked file\
    \ and reason.\n- If a shared active cadenza file changes while you edit it, re-read it and retry only your owner-scoped\
    \ row once; after a second conflict, record the blocked coordination update in your required artifact and keep moving.\n\
    \n## Techniques Available — plan phase\n\n### MCP Tools\n- **filesystem**: filesystem MCP server\n\n### Protocols\n- **A2A**:\
    \ Discover running agents, delegate tasks, check inbox\n\n### Skills\n- **coordination**: coordination\n- **voice**: voice\n\
    - **guide-specialist**: guide specialist method for newcomer documentation\n\n{% if thinking_method %}## Thinking method\n\
    {{ thinking_method }}\n{% endif %}\n\nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir }}\n{% elif stage\
    \ == 3 %}\n# Phase: work (sheet 3 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice\
    \ }}\n\nObjective: Execute the plan. Build, write, fix. Leave the workspace better and the plan's success criteria satisfied.\n\
    \n## Required Output\n- Execute only the scoped plan. Update project files as needed.\n- Write `{{ workspace }}/cycle-state/{{\
    \ agent_name }}-work.md` with exact section labels: WORK DONE:, FILES CHANGED:, EVIDENCE:, NEXT:.\n- Do not claim completion\
    \ unless the required artifact exists.\n- Ground claims in file paths, command output, or observed workspace state.\n\
    - If shared active cadenza files are available in this phase, read all four direct files: `01-task-board.md`, `02-status.md`,\
    \ `03-urgent-directives.md`, and `04-handoffs.md`. Treat urgent directives as controlling. Mark your owner-scoped task\
    \ claim done with the required artifact as evidence; update `02-status.md` in its existing form without inventing a schema;\
    \ add a handoff tuple when another owner must continue. If a second write conflict blocks a required update, write `COORDINATION\
    \ UPDATE BLOCKED:` in the required artifact with the blocked file and reason.\n- If a shared active cadenza file changes\
    \ while you edit it, re-read it and retry only your owner-scoped row once; after a second conflict, record the blocked\
    \ coordination update in your required artifact and keep moving.\n\n## Techniques Available — work phase\n\n### MCP Tools\n\
    - **github**: github MCP server\n- **filesystem**: filesystem MCP server\n\n### Protocols\n- **A2A**: Discover running\
    \ agents, delegate tasks, check inbox\n\n### Skills\n- **mateship**: mateship\n- **voice**: voice\n- **guide-specialist**:\
    \ guide specialist method for newcomer documentation\n\nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir\
    \ }}\n{% elif stage == 4 %}\nset -euo pipefail\nWORKSPACE=\"{{ workspace }}\"\nAGENT_DIR=\"{{ agent_identity_dir }}\"\n\
    AGENT_NAME=\"{{ agent_name }}\"\nSTATE_DIR=\"${WORKSPACE}/cycle-state\"\nmkdir -p \"$STATE_DIR\"\nrm -f \"$STATE_DIR/temperature-${AGENT_NAME}-play\"\
    \nrm -f \"$STATE_DIR/temperature-${AGENT_NAME}-work\"\nTHRESHOLD=\"${MEMORY_BLOAT_THRESHOLD:-3000}\"\nSTAGNATION=\"${STAGNATION_CYCLES:-3}\"\
    \nMIN_BETWEEN=\"${MIN_CYCLES_BETWEEN_PLAY:-5}\"\n\ncycle_count=\"$(awk -F: '$1 == \"cycle_count\" {gsub(/ /, \"\", $2);\
    \ print $2; exit}' \"$AGENT_DIR/profile.yaml\" 2>/dev/null || true)\"\nlast_play=\"$(awk -F: '$1 == \"last_play_cycle\"\
    \ {gsub(/ /, \"\", $2); print $2; exit}' \"$AGENT_DIR/profile.yaml\" 2>/dev/null || true)\"\ncycle_count=\"${cycle_count:-0}\"\
    \nlast_play=\"${last_play:-0}\"\ncase \"$cycle_count\" in \"\"|*[!0-9-]*) cycle_count=0 ;; esac\ncase \"$last_play\" in\
    \ \"\"|*[!0-9-]*) last_play=0 ;; esac\n\ndecision=\"work\"\nreason=\"default-work\"\nsince_play=$((cycle_count - last_play))\n\
    if [ \"$since_play\" -lt \"$MIN_BETWEEN\" ]; then\n  reason=\"too-soon-since-play\"\nelse\n  l3_words=\"$(wc -w < \"$AGENT_DIR/recent.md\"\
    \ 2>/dev/null || echo 0)\"\n  l3_words=\"$(echo \"$l3_words\" | tr -d \"[:space:]\")\"\n  l3_words=\"${l3_words:-0}\"\n\
    \  if [ \"$l3_words\" -gt \"$THRESHOLD\" ]; then\n    decision=\"play\"\n    reason=\"memory-bloat\"\n  elif [ -f \"$AGENT_DIR/growth.md\"\
    \ ]; then\n    growth_mtime=\"$(stat -c %Y \"$AGENT_DIR/growth.md\" 2>/dev/null || echo 0)\"\n    now=\"$(date +%s)\"\n\
    \    growth_age_days=$(((now - growth_mtime) / 86400))\n    growth_age_days=\"$(echo \"$growth_age_days\" | tr -d \"[:space:]\"\
    )\"\n    growth_age_days=\"${growth_age_days:-0}\"\n    if [ \"$growth_age_days\" -gt \"$STAGNATION\" ]; then\n      decision=\"\
    play\"\n      reason=\"growth-stagnation\"\n    fi\n  fi\n  if [ \"$decision\" = \"work\" ] && [ -f \"$WORKSPACE/TASKS.md\"\
    \ ]; then\n    urgent=\"$(grep -Ec \"\\- \\[ \\].*(P0|P1)\" \\\n      \"$WORKSPACE/TASKS.md\" 2>/dev/null || true)\"\n\
    \    urgent=\"$(echo \"$urgent\" | tr -d \"[:space:]\")\"\n    urgent=\"${urgent:-0}\"\n    if [ \"$urgent\" -eq 0 ];\
    \ then\n      decision=\"play\"\n      reason=\"no-urgent-tasks\"\n    fi\n  fi\n  if [ \"$decision\" = \"work\" ] &&\
    \ [ -f \"$WORKSPACE/composer-notes.yaml\" ]; then\n    if grep -qi \"play.*${AGENT_NAME}\" \"$WORKSPACE/composer-notes.yaml\"\
    ; then\n      decision=\"play\"\n      reason=\"composer-directive\"\n    fi\n  fi\nfi\n\nif [ \"$decision\" = \"play\"\
    \ ]; then\n  touch \"$STATE_DIR/temperature-${AGENT_NAME}-play\"\nelse\n  touch \"$STATE_DIR/temperature-${AGENT_NAME}-work\"\
    \nfi\ncat > \"$STATE_DIR/temperature-${AGENT_NAME}-report.md\" <<REPORT\ndecision: ${decision}\nreason: ${reason}\ncycle_count:\
    \ ${cycle_count}\nlast_play_cycle: ${last_play}\nREPORT\necho \"temperature decision: ${decision} (${reason})\"\n{% elif\
    \ stage == 5 %}\n# Phase: integration (sheet 5 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\n\
    Voice: {{ agent_voice }}\n\nObjective: Integrate the work: reconcile with the wider system, resolve seams, make it land\
    \ cleanly.\n\n## Required Output\n- Write `{{ workspace }}/cycle-state/{{ agent_name }}-integration.md`.\n- Use exact\
    \ section labels: INTEGRATED:, CONFLICTS:, DECISIONS:, EVIDENCE:.\n- Do not claim completion unless the required artifact\
    \ exists.\n- Ground claims in file paths, command output, or observed workspace state.\n- If shared active cadenza files\
    \ are available in this phase, read all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`,\
    \ and `04-handoffs.md`. Treat urgent directives as controlling. Mark your owner-scoped task claim done with the required\
    \ artifact as evidence; update `02-status.md` in its existing form without inventing a schema; add a handoff tuple when\
    \ another owner must continue. If a second write conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:`\
    \ in the required artifact with the blocked file and reason.\n- If a shared active cadenza file changes while you edit\
    \ it, re-read it and retry only your owner-scoped row once; after a second conflict, record the blocked coordination update\
    \ in your required artifact and keep moving.\n\n## Techniques Available — integration phase\n\n### MCP Tools\n- **github**:\
    \ github MCP server\n- **filesystem**: filesystem MCP server\n\n### Protocols\n- **A2A**: Discover running agents, delegate\
    \ tasks, check inbox\n\n### Skills\n- **coordination**: coordination\n- **voice**: voice\n\nWorkspace: {{ workspace }}\n\
    Identity dir: {{ agent_identity_dir }}\n{% elif stage == 6 %}\n# Phase: play (sheet 6 of 12)\n\nYou are {{ agent_name\
    \ }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice }}\n\nObjective: Free exploration: try the unexpected angle,\
    \ prototype the weird idea, stress what was built.\n\n## Required Output\n- Create or update a play artifact under `{{\
    \ workspace }}/playspace/{{ agent_name }}/`.\n- Write `{{ workspace }}/cycle-state/{{ agent_name }}-play.md` with exact\
    \ section labels: EXPERIMENT:, RESULT:, TRANSFER:.\n- Do not claim completion unless the required artifact exists.\n-\
    \ Ground claims in file paths, command output, or observed workspace state.\n- If shared active cadenza files are available\
    \ in this phase, read all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`, and `04-handoffs.md`.\
    \ Treat urgent directives as controlling. Mark your owner-scoped task claim done with the required artifact as evidence;\
    \ update `02-status.md` in its existing form without inventing a schema; add a handoff tuple when another owner must continue.\
    \ If a second write conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:` in the required artifact with\
    \ the blocked file and reason.\n- If a shared active cadenza file changes while you edit it, re-read it and retry only\
    \ your owner-scoped row once; after a second conflict, record the blocked coordination update in your required artifact\
    \ and keep moving.\n\n## Techniques Available — play phase\n\n### MCP Tools\n- **filesystem**: filesystem MCP server\n\
    \n### Skills\n- **voice**: voice\n\nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir }}\n{% elif stage\
    \ == 7 %}\n# Phase: inspect (sheet 7 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice\
    \ }}\n\nObjective: Adversarial review of the cycle's work: find what is wrong, weak, or missing. No politeness.\n\n##\
    \ Required Output\n- Write `{{ workspace }}/cycle-state/{{ agent_name }}-inspection.md`.\n- Use exact section labels:\
    \ VERDICT:, EVIDENCE:, FAILURES:, RISKS:, REQUIRED FIXES:.\n- Do not claim completion unless the required artifact exists.\n\
    - Ground claims in file paths, command output, or observed workspace state.\n- If shared active cadenza files are available\
    \ in this phase, read all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`, and `04-handoffs.md`.\
    \ Treat urgent directives as controlling. Mark your owner-scoped task claim done with the required artifact as evidence;\
    \ update `02-status.md` in its existing form without inventing a schema; add a handoff tuple when another owner must continue.\
    \ If a second write conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:` in the required artifact with\
    \ the blocked file and reason.\n- If a shared active cadenza file changes while you edit it, re-read it and retry only\
    \ your owner-scoped row once; after a second conflict, record the blocked coordination update in your required artifact\
    \ and keep moving.\n\n## Techniques Available — inspect phase\n\n### MCP Tools\n- **filesystem**: filesystem MCP server\n\
    \n### Protocols\n- **A2A**: Discover running agents, delegate tasks, check inbox\n\n### Skills\n- **mateship**: mateship\n\
    - **voice**: voice\n- **guide-specialist**: guide specialist method for newcomer documentation\n\n{% if thinking_method\
    \ %}## Thinking method\n{{ thinking_method }}\n{% endif %}\n\nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir\
    \ }}\n{% elif stage == 8 %}\n# Phase: aar (sheet 8 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\n\
    Voice: {{ agent_voice }}\n\nObjective: After-action review: what happened vs what was intended, and why. Specific, falsifiable\
    \ observations.\n\n## Required Output\n- Write `{{ workspace }}/cycle-state/{{ agent_name }}-aar.md`.\n- Use exact section\
    \ labels: INTENDED:, ACTUAL:, DELTA:, SUSTAIN:, IMPROVE:, EVIDENCE:.\n- Do not claim completion unless the required artifact\
    \ exists.\n- Ground claims in file paths, command output, or observed workspace state.\n- If shared active cadenza files\
    \ are available in this phase, read all four direct files: `01-task-board.md`, `02-status.md`, `03-urgent-directives.md`,\
    \ and `04-handoffs.md`. Treat urgent directives as controlling. Mark your owner-scoped task claim done with the required\
    \ artifact as evidence; update `02-status.md` in its existing form without inventing a schema; add a handoff tuple when\
    \ another owner must continue. If a second write conflict blocks a required update, write `COORDINATION UPDATE BLOCKED:`\
    \ in the required artifact with the blocked file and reason.\n- If a shared active cadenza file changes while you edit\
    \ it, re-read it and retry only your owner-scoped row once; after a second conflict, record the blocked coordination update\
    \ in your required artifact and keep moving.\n\n## Techniques Available — aar phase\n\n### MCP Tools\n- **filesystem**:\
    \ filesystem MCP server\n\n### Protocols\n- **A2A**: Discover running agents, delegate tasks, check inbox\n\n### Skills\n\
    - **mateship**: mateship\n- **voice**: voice\n- **guide-specialist**: guide specialist method for newcomer documentation\n\
    \nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir }}\n{% elif stage == 9 %}\n# Phase: consolidate (sheet\
    \ 9 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice }}\n\nObjective: Compress\
    \ the cycle's learnings into durable artifacts: memory updates, distilled notes, pruned noise.\n\n## Required Output\n\
    - Update recent/profile memory files only with grounded facts from this cycle.\n- Write `{{ workspace }}/cycle-state/{{\
    \ agent_name }}-consolidation.md` with exact section labels: BELIEFS:, PRUNED:, ARCHIVED:, EVIDENCE:.\n- Do not claim\
    \ completion unless the required artifact exists.\n- Ground claims in file paths, command output, or observed workspace\
    \ state.\n- If shared active cadenza files are available in this phase, read all four direct files: `01-task-board.md`,\
    \ `02-status.md`, `03-urgent-directives.md`, and `04-handoffs.md`. Treat urgent directives as controlling. Mark your owner-scoped\
    \ task claim done with the required artifact as evidence; update `02-status.md` in its existing form without inventing\
    \ a schema; add a handoff tuple when another owner must continue. If a second write conflict blocks a required update,\
    \ write `COORDINATION UPDATE BLOCKED:` in the required artifact with the blocked file and reason.\n- If a shared active\
    \ cadenza file changes while you edit it, re-read it and retry only your owner-scoped row once; after a second conflict,\
    \ record the blocked coordination update in your required artifact and keep moving.\n\n## Techniques Available — consolidate\
    \ phase\n\n### MCP Tools\n- **filesystem**: filesystem MCP server\n\n### Skills\n- **memory-protocol**: memory-protocol\n\
    - **voice**: voice\n\nWorkspace: {{ workspace }}\nIdentity dir: {{ agent_identity_dir }}\n{% elif stage == 10 %}\n# Phase:\
    \ reflect (sheet 10 of 12)\n\nYou are {{ agent_name }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice }}\n\n\
    Objective: Step back: what does this cycle mean for the agent's trajectory and the project's direction?\n\n## Required\
    \ Output\n- Update growth/profile relationship notes when warranted.\n- Write `{{ workspace }}/cycle-state/{{ agent_name\
    \ }}-reflection.md` with exact section labels: TRAJECTORY:, RELATIONSHIPS:, GROWTH:, NEXT:.\n- Do not claim completion\
    \ unless the required artifact exists.\n- Ground claims in file paths, command output, or observed workspace state.\n\
    - If shared active cadenza files are available in this phase, read all four direct files: `01-task-board.md`, `02-status.md`,\

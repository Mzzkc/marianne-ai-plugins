    \ schema/kind mismatch\")\nif str(receipt.get(\"agent\", \"\")).lower() != os.environ[\"AGENT\"].lower():\n    raise SystemExit(\"\
    lifecycle integration receipt agent mismatch\")\nif receipt.get(\"status\") != \"integrated\":\n    raise SystemExit(\"\
    lifecycle integration status must be integrated\")\ninputs = yaml.safe_load(Path(os.environ[\"INPUT\"]).read_text())\n\
    source_debt_path = Path(inputs[\"source_debt_path\"])\nsource_debt_bytes = source_debt_path.read_bytes()\nsource_debt_hash\
    \ = \"sha256:\" + hashlib.sha256(source_debt_bytes).hexdigest()\nif source_debt_hash != inputs.get(\"source_debt_sha256\"\
    ):\n    raise SystemExit(\"source debt snapshot hash mismatch\")\nsource_debt = yaml.safe_load(source_debt_bytes)\nif\
    \ receipt.get(\"source_debt_sha256\") != source_debt_hash:\n    raise SystemExit(\"integration receipt is not bound to\
    \ source debt\")\nif receipt.get(\"source_memory\") != \"recent.md\":\n    raise SystemExit(\"integration source_memory\
    \ must be canonical recent.md\")\nbefore = str(receipt.get(\"memory_before_sha256\", \"\"))\nafter = str(receipt.get(\"\
    memory_after_sha256\", \"\"))\nvalid_hash = lambda value: len(value) == 71 and value.startswith(\"sha256:\") and all(\n\
    \    char in \"0123456789abcdef\" for char in value[7:]\n)\nif not valid_hash(before) or not valid_hash(after):\n    raise\
    \ SystemExit(\"lifecycle integration receipt lacks memory hashes\")\nif before != source_debt.get(\"recent_memory_after_sha256\"\
    ):\n    raise SystemExit(\"integration before hash does not continue source debt\")\nif before == after:\n    raise SystemExit(\"\
    lifecycle integration did not change canonical memory\")\ncurrent = \"sha256:\" + hashlib.sha256(Path(os.environ[\"RECENT\"\
    ]).read_bytes()).hexdigest()\nif current != after:\n    raise SystemExit(\"integration after hash does not match canonical\
    \ recent memory\")\nif receipt.get(\"closed_debt\") != [source_debt.get(\"source_engagement\")]:\n    raise SystemExit(\"\
    closed_debt does not exactly name the source engagement\")\nrecall = receipt.get(\"later_recall\")\nrequired_recall =\
    \ {\n    \"source_engagement\", \"source_evidence_sha256\", \"recalled_learning\", \"present_application\"\n}\nif not\
    \ isinstance(recall, dict) or set(recall) != required_recall:\n    raise SystemExit(\"later_recall must use the typed\
    \ recall contract\")\nif recall[\"source_engagement\"] != source_debt.get(\"source_engagement\"):\n    raise SystemExit(\"\
    later recall source engagement mismatch\")\nevidence_hashes = {\n    item.get(\"sha256\") for item in source_debt.get(\"\
    evidence\", []) if isinstance(item, dict)\n}\nif recall[\"source_evidence_sha256\"] not in evidence_hashes:\n    raise\
    \ SystemExit(\"later recall is not bound to source evidence\")\nif not str(recall[\"recalled_learning\"]).strip() or not\
    \ str(recall[\"present_application\"]).strip():\n    raise SystemExit(\"later recall lacks learning or present application\"\
    )\nreceipt_hash = \"sha256:\" + hashlib.sha256(Path(os.environ[\"RECEIPT\"]).read_bytes()).hexdigest()\ndebt = yaml.safe_load(Path(os.environ[\"\
    DEBT\"]).read_text())\nif debt.get(\"status\") != \"integrated\":\n    raise SystemExit(\"canonical lifecycle debt was\
    \ not closed\")\nif debt.get(\"source_debt_sha256\") != source_debt_hash:\n    raise SystemExit(\"closed lifecycle debt\
    \ is not bound to its source\")\nif debt.get(\"integration_receipt_sha256\") != receipt_hash:\n    raise SystemExit(\"\
    closed lifecycle debt is not bound to this integration receipt\")\nconflict_hash = inputs.get(\"source_seed_conflicts_sha256\"\
    )\nresolution_value = receipt.get(\"seed_resolution_receipt\")\nif conflict_hash:\n    if not isinstance(resolution_value,\
    \ str) or not resolution_value:\n        raise SystemExit(\"seed conflict snapshot requires an agent resolution receipt\"\
    )\n    resolution_path = Path(resolution_value).resolve()\n    expected_root = (\n        Path(os.environ[\"AGENT_DIR\"\
    ]) / \".marianne\" / \"seed-resolution-receipts\"\n    ).resolve()\n    try:\n        resolution_path.relative_to(expected_root)\n\
    \    except ValueError as exc:\n        raise SystemExit(\"seed resolution receipt is outside agent-owned receipt storage\"\
    ) from exc\n    resolution = yaml.safe_load(resolution_path.read_text())\n    if (\n        resolution.get(\"authority\"\
    ) != \"agent\"\n        or resolution.get(\"pending_conflicts_sha256\") != conflict_hash\n    ):\n        raise SystemExit(\"\
    seed resolution receipt does not close observed conflicts\")\nelif resolution_value not in (None, \"\"):\n    raise SystemExit(\"\
    seed resolution receipt supplied without observed conflicts\")\nPY"
  condition: stage == 12
  description: Lifecycle integration recall for guide is grounded
  timeout_seconds: 10

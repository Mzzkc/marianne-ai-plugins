name: lifecycle-integration-guide
workspace: ~/.marianne/agents/guide/workspaces/REQUIRES-LIVE-BINDING-lifecycle-integration
instrument: claude-code
instrument_fallbacks:
- codex-cli
- opencode
- antigravity
sheet:
  size: 1
  total_items: 12
  descriptions:
    1: Recon — survey project state
    2: Plan — write cycle plan
    3: Work — execute against plan
    4: Temperature check — gate play phase
    5: Integration — merge and coordinate
    6: Play — explore and experiment
    7: Inspect — quality and security review
    8: AAR — after-action review
    9: Consolidate — memory management
    10: Reflect — growth and insight
    11: Maturity check — developmental measurement
    12: Resurrect — identity refresh for next cycle
  prelude:
  - file: ~/.marianne/agents/guide/identity.md
    as: context
    required: true
  cadenzas:
    1:
    - file: ~/.marianne/agents/guide/profile.yaml
      as: context
      required: true
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    - directory: ~/.marianne/agents/guide/cadenzas/personal/active
      as: context
      required: true
    2:
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    - directory: ~/.marianne/agents/guide/cadenzas/personal/active
      as: context
      required: true
    3:
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    - directory: ~/.marianne/agents/guide/cadenzas/personal/active
      as: context
      required: true
    6:
    - file: ~/.marianne/agents/guide/growth.md
      as: context
      required: true
    7:
    - file: ~/.marianne/agents/guide/profile.yaml
      as: context
      required: true
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    - directory: ~/.marianne/agents/guide/cadenzas/personal/active
      as: context
      required: true
    8:
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    9:
    - file: ~/.marianne/agents/guide/profile.yaml
      as: context
      required: true
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    10:
    - file: ~/.marianne/agents/guide/profile.yaml
      as: context
      required: true
    - file: ~/.marianne/agents/guide/growth.md
      as: context
      required: true
    12:
    - file: ~/.marianne/agents/guide/profile.yaml
      as: context
      required: true
    - file: ~/.marianne/agents/guide/recent.md
      as: context
      required: true
    - file: ~/.marianne/agents/guide/growth.md
      as: context
      required: true
    5:
    - directory: ~/.marianne/agents/guide/cadenzas/personal/active
      as: context
      required: true
  dependencies:
    2:
    - 1
    3:
    - 2
    4:
    - 3
    5:
    - 4
    6:
    - 4
    7:
    - 4
    8:
    - 5
    - 6
    - 7
    9:
    - 5
    - 6
    - 7
    10:
    - 5
    - 6
    - 7
    11:
    - 8
    - 9
    - 10
    12:
    - 11
  skip_when:
    6:
      command: 'true'
      description: Lifecycle integration omits ordinary play work
      timeout_seconds: 5
    2:
      command: 'true'
      description: Lifecycle integration omits ordinary plan work
      timeout_seconds: 5
    3:
      command: 'true'
      description: Lifecycle integration omits ordinary work work
      timeout_seconds: 5
    4:
      command: 'true'
      description: Lifecycle integration omits ordinary temperature_check work
      timeout_seconds: 5
    5:
      command: 'true'
      description: Lifecycle integration omits ordinary integration work
      timeout_seconds: 5
    7:
      command: 'true'
      description: Lifecycle integration omits ordinary inspect work
      timeout_seconds: 5
    8:
      command: 'true'
      description: Lifecycle integration omits ordinary aar work
      timeout_seconds: 5
  prompt_extensions:
    1:
    - Read `~/.marianne/agents/guide/.marianne/pending-lifecycle-debt.yaml` when it exists.
    - Read `~/.marianne/agents/guide/.marianne/pending-seed-conflicts.yaml` when it exists.
    - Inventory every open lifecycle debt and portable-seed conflict; preserve agent authority over all semantic decisions.
    9:
    - Consolidate every grounded pending engagement into canonical recent/profile memory. Record before/after hashes and leave
      unrelated memory untouched.
    10:
    - Reflect on pending engagements and seed conflicts. Update growth and relationships only where the evidence warrants
      it.
    12:
    - Adjudicate portable-seed conflicts as the agent, close only debt actually integrated, and use the typed, conflict-bound
      agent resolution flow when the stage-1 lifecycle inputs captured a seed conflict.
    - Demonstrate later recall of at least one engagement-specific learning; name the source memory and how it changed present
      judgment.
    - 'Write `{{ workspace }}/cycle-state/{{ agent_name }}-lifecycle-integration-receipt.yaml` with schema_version: 1, kind:
      marianne-lifecycle-integration, this agent name, status: integrated, source_debt_sha256, source_memory: recent.md, closed_debt,
      memory_before_sha256, memory_after_sha256, optional seed_resolution_receipt, and typed later_recall with source_engagement,
      source_evidence_sha256, recalled_learning, and present_application. The before hash must continue the captured source
      debt and the after hash must match canonical recent.md after a real transition.'
    - 'Update `~/.marianne/agents/guide/.marianne/pending-lifecycle-debt.yaml` to status: integrated, preserve its source
      engagement, and bind it to the source debt and final integration receipt with source_debt_sha256 and integration_receipt_sha256.'

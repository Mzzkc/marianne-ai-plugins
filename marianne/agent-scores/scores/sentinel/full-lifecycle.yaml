    Identity dir: {{ agent_identity_dir }}\n{% elif stage == 6 %}\n# Phase: play (sheet 6 of 12)\n\nYou are {{ agent_name\
    \ }} — {{ role }}. Focus: {{ focus }}.\nVoice: {{ agent_voice }}\n\nObjective: Free exploration: try the unexpected angle,\
    \ prototype the weird idea, stress what was built.\n\n## Required Output\n- Create or update a play artifact under `{{\

    \    return marker in artifact_text and filename in artifact_text\n\ndef rows(path: Path) -> list[list[str]]:\n    if\
    \ not path.exists():\n        return []\n    parsed: list[list[str]] = []\n    for line in path.read_text(errors=\"replace\"\
    ).splitlines():\n        stripped = line.strip()\n        if not stripped.startswith(\"|\") or not stripped.endswith(\"\
    |\"):\n            continue\n        cells = [cell.strip().strip(\"`\") for cell in stripped.strip(\"|\").split(\"|\"\
    )]\n        if not cells or cells[0].lower() in {\"id\", \"agent\", \"---\"}:\n            continue\n        if all(set(cell)\
    \ <= {\"-\"} for cell in cells if cell):\n            continue\n        parsed.append(cells)\n    return parsed\n\ndef\
    \ task_id_errors() -> list[str]:\n    errors: list[str] = []\n    seen: dict[str, int] = {}\n    for cells in rows(task_board):\n\
    \        if not cells:\n            continue\n        row_id = cells[0]\n        if not row_id or \"{\" in row_id or \"\
    }\" in row_id:\n            continue\n        seen[row_id] = seen.get(row_id, 0) + 1\n        if re.fullmatch(r\"(?:[A-Z]+-)?\\\

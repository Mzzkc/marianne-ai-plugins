    actual = sum(\n    1\n    for path in (workspace / \"scores\").glob(\"*.yaml\")\n    if path.name != \"fleet.yaml\"\n\
    )\ntext = report.read_text(errors=\"replace\").lower()\n\nunits = {\n    \"zero\": 0,\n    \"one\": 1,\n    \"two\": 2,\n\
    \    \"three\": 3,\n    \"four\": 4,\n    \"five\": 5,\n    \"six\": 6,\n    \"seven\": 7,\n    \"eight\": 8,\n    \"\
    nine\": 9,\n    \"ten\": 10,\n    \"eleven\": 11,\n    \"twelve\": 12,\n    \"thirteen\": 13,\n    \"fourteen\": 14,\n\
    \    \"fifteen\": 15,\n    \"sixteen\": 16,\n    \"seventeen\": 17,\n    \"eighteen\": 18,\n    \"nineteen\": 19,\n}\n\
    tens = {\n    \"twenty\": 20,\n    \"thirty\": 30,\n    \"forty\": 40,\n    \"fifty\": 50,\n    \"sixty\": 60,\n}\n\n\
    def parse_count(raw: str) -> int | None:\n    raw = raw.strip().replace(\"-\", \" \")\n    if raw.isdigit():\n       \
    \ return int(raw)\n    parts = raw.split()\n    if len(parts) == 1:\n        return units.get(parts[0]) or tens.get(parts[0])\n\
    \    if len(parts) == 2 and parts[0] in tens and parts[1] in units:\n        return tens[parts[0]] + units[parts[1]]\n\
    \    return None\n\nnum = (\n    r\"\\d+|(?:zero|one|two|three|four|five|six|seven|eight|nine|ten|\"\n    r\"eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|\"\
    \n    r\"eighteen|nineteen|twenty|thirty|forty|fifty|sixty)\"\n    r\"(?:[- ](?:one|two|three|four|five|six|seven|eight|nine))?\"\
    \n)\nclaim_patterns = [\n    re.compile(rf\"\\b(?P<num>{num})\\s+(?:agent\\s+scores?|scored\\s+agents?|agent\\s+score\\\
    s+files?)\\b\"),\n    re.compile(rf\"\\b(?:agent\\s+scores?|scored\\s+agents?|agent\\s+score\\s+files?)\\D{0,24}(?P<num>{num})\\\
    b\"),\n]\nbad: list[tuple[str, int]] = []\nfor pattern in claim_patterns:\n    for match in pattern.finditer(text):\n\
    \        parsed = parse_count(match.group(\"num\"))\n        if parsed is not None and parsed != actual:\n           \
    \ bad.append((match.group(0), parsed))\n\nif bad:\n    print(\n        f\"fleet score count claim(s) disagree with disk\
    \ count {actual}: \"\n        + \"; \".join(f\"{claim!r} -> {count}\" for claim, count in bad),\n        file=sys.stderr,\n\
    \    )\n    sys.exit(1)\nPY"
